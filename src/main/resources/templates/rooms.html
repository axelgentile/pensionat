<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Alla rum</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div class="sidebar">
    <h2>BookMe</h2>
    <a th:href="@{/customers/all}">Kunder</a>
    <a th:href="@{/rooms/all}">Rum</a>
    <a th:href="@{/bookings/all}">Bokningar</a>
    <a th:href="@{/bookings/new}">Ny Bokning</a>
</div>


<h1>Alla rum</h1>
<div th:if="${successMessage}" style="color: green; text-align: center; margin-bottom: 1em; font-weight: bold;">
    <p th:text="${successMessage}"></p>
</div>
<div th:if="${deleteMessage}" style="color: red; text-align: center; margin-bottom: 1em; font-weight: bold;">
    <p th:text="${deleteMessage}"></p>
</div>
<div th:if="${errorMessage}" style="color: red; text-align: center; margin-bottom: 1em; font-weight: bold;">
    <p th:text="${errorMessage}"></p>
</div>
<div style="display: flex; justify-content: center; gap: 20px; margin-top: 20px;">
    <form th:action="@{/rooms/create}" method="get">
        <button type="submit">Skapa nytt rum</button>
    </form>
</div>
<table>
    <thead>
    <tr>
        <th>Rumsnummer</th>
        <th>Rumstyp</th>
        <th>Pris per natt</th>
        <th>Redigera rum</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="room : ${rooms}">
        <td th:text="${room.roomNumber}">101</td>
        <td th:text="${room.roomType}">SINGLE</td>
        <td th:text="${room.pricePerNight} + ' kr'">750</td>

        <td>
            <form th:action="@{/rooms/delete/{id}(id=${room.id})}" method="post"
                  onsubmit="return confirm('Är du säker på att du vill ta bort detta rum?');">
                <button type="submit">Ta bort</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
