<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Alla kunder</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div class="sidebar">
    <h2>BookMe</h2>
    <a th:href="@{/customers/all}">Kunder</a>
    <a th:href="@{/rooms/all}">Rum</a>
    <a th:href="@{/bookings/all}">Bokningar</a>
    <a th:href="@{/bookings/new}">Ny Bokning</a>
</div>

<h1>Alla kunder</h1>

<div th:if="${successMessage}" style="color: green; text-align: center; margin-bottom: 1em; font-weight: bold;">
    <p th:text="${successMessage}"></p>
</div>

<div th:if="${deleteMessage}" style="color: red; text-align: center; margin-bottom: 1em; font-weight: bold;">
    <p th:text="${deleteMessage}"></p>
</div>

<div th:if="${errorMessage}" style="color: red; text-align: center; margin-bottom: 1em; font-weight: bold;">
    <p th:text="${errorMessage}"></p>
</div>

<div style="display: flex; justify-content: center; gap: 20px; margin-top: 20px;">
    <form th:action="@{/customers/register}" method="get">
        <button type="submit">Registrera ny kund</button>
    </form>
</div>

<table>
    <thead>
    <tr>
        <th>Kund förnamn</th>
        <th>Kund efternamn</th>
        <th>E-mail</th>
        <th>Telefonnummer</th>
        <th>Redigera kund</th>
        <th>Ta bort kund</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="customer : ${customers}">
        <td th:text="${customer.firstName}">Förnamn</td>
        <td th:text="${customer.lastName}">Efternamn</td>
        <td th:text="${customer.email}">email@example.com</td>
        <td th:text="${customer.phoneNum}">0701234561</td>

        <td>
            <form th:action="@{/customers/edit/{id}(id=${customer.id})}" method="get">
                <button type="submit">Redigera</button>
            </form>
        </td>

        <td>
            <form th:action="@{/customers/delete/{id}(id=${customer.id})}" method="post"
                  onsubmit="return confirm('Är du säker på att du vill ta bort denna kund?');">
                <button type="submit">Ta bort</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
