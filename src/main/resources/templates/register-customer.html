<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registrera Kund</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div class="sidebar">
    <h2>BookMe</h2>
    <a th:href="@{/customers/all}">Kunder</a>
    <a th:href="@{/rooms/all}">Rum</a>
    <a th:href="@{/bookings/all}">Bokningar</a>
</div>

<h1>Registrera Kund</h1>

<form th:action="@{/customers/register}" th:object="${customerDto}" method="post">

    <label for="firstName">Förnamn:</label>
    <input type="text" id="firstName" th:field="*{firstName}" />
    <div class="error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>

    <label for="lastName">Efternamn:</label>
    <input type="text" id="lastName" th:field="*{lastName}" />
    <div class="error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>

    <label for="email">E-post:</label>
    <input type="email" id="email" th:field="*{email}" />
    <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

    <label for="phoneNum">Telefonnummer:</label>
    <input type="text" id="phoneNum" th:field="*{phoneNum}" />
    <div class="error" th:if="${#fields.hasErrors('phoneNum')}" th:errors="*{phoneNum}"></div>
    <br>
    <br>

    <button type="submit">Registrera</button>

</form>
<br>
<form th:action="@{/customers/all}" method="get">
    <button type="submit" style="padding: 2px 4px; font-size: 12px;">&larr; Gå tillbaka</button>
</form>



</body>
</html>
